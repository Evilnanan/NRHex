[package]
name = "nrhex"
version = "0.17.235"
edition = "2021"
publish = false

[lib]
name = "NRHex"
crate-type = ["cdylib", "rlib"]

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "fast_fmt"] }
sha2 = "0.10"

[features]
default = ["test-hotkeys"]
test-hotkeys = []
cage-lifecycle-probe = []
cage-demand = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
